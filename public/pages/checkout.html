<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NovaMart checkout — choose a delivery address, review your order and place it." />
  <title>Checkout · NovaMart</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/products.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    /* Page-scoped additions for the checkout layout (reuses global tokens) */
    .checkout-layout { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 32px 0; }
    @media (min-width: 900px) { .checkout-layout { grid-template-columns: 1.6fr 1fr; align-items: start; } }
    .co-section { background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .co-section > h2 { margin: 0 0 14px; font-size: 1.05rem; }
    .addr-list { display: grid; gap: 10px; margin-bottom: 14px; }
    .addr-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 10px; padding: 12px; cursor: pointer; }
    .addr-card.selected { border-color: var(--primary-color, #111); box-shadow: 0 0 0 2px rgba(17,17,17,.08); }
    .addr-card input[type="radio"] { margin-top: 4px; }
    .addr-body { flex: 1; font-size: .92rem; line-height: 1.45; }
    .addr-name { font-weight: 600; }
    .addr-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .addr-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
      border-top: 1px dashed var(--border-color, #e5e7eb); padding-top: 14px; }
    .addr-form .full { grid-column: 1 / -1; }
    .co-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
      border-bottom: 1px dashed var(--border-color, #e5e7eb); font-size: .93rem; }
    .co-item:last-child { border-bottom: 0; }
    .confirm-box { text-align: center; padding: 40px 16px; }
    .confirm-box h2 { color: var(--primary-color, #111); }
  </style>
</head>
<body data-base="../">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <button class="icon-btn nav-toggle" id="nav-toggle" aria-expanded="false"
        aria-controls="mobile-nav" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">N</span>NovaMart</a>

      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="../index.html#categories">Categories</a></li>
          <li><a href="products.html?sale=1">Deals</a></li>
        </ul>
      </nav>

      <form class="nav-search" action="products.html" method="get" role="search">
        <input class="input" type="search" name="q" placeholder="Search products..." aria-label="Search products" />
        <button type="submit" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        </button>
      </form>

      <div class="header-actions">
        <div class="wish-wrap">
          <button class="icon-btn" id="wish-btn" aria-haspopup="true" aria-expanded="false" aria-label="Wishlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.8C6.9 17 3.5 13.7 3.5 10a4.6 4.6 0 0 1 4.6-4.6c1.6 0 3 .8 3.9 2.1a4.8 4.8 0 0 1 3.9-2.1A4.6 4.6 0 0 1 20.5 10c0 3.7-3.4 7-8.5 10.8Z"/></svg>
            <span class="count-badge" id="wish-count" hidden>0</span>
          </button>
          <div class="wish-pop" id="wish-pop" hidden>
            <h3>Wishlist</h3>
            <ul id="wish-list"></ul>
          </div>
        </div>
        <a class="icon-btn" href="cart.html" aria-label="Shopping cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.2L19.5 8H6"/></svg>
          <span class="count-badge" id="cart-count" hidden>0</span>
        </a>
        <a class="icon-btn" href="login.html" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        </a>
      </div>
    </div>

    <div class="mobile-nav" id="mobile-nav" hidden>
      <nav aria-label="Mobile">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="../index.html#categories">Categories</a></li>
          <li><a href="products.html?sale=1">Deals</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html">Sign in</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <h1 class="page-title" style="padding-top:32px">Checkout</h1>
      <div id="checkout-root"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom" style="border-top:0">
      <span>© 2026 NovaMart — demo e-commerce project.</span>
      <span>Built with HTML, CSS &amp; JavaScript.</span>
    </div>
  </footer>

  <script src="../js/app.js?v=20260910a" defer></script>
  <script src="../js/checkout.js?v=20260910a" defer></script>
</body>
</html>
